<style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-surface-container-lowest/90 backdrop-blur-md border border-surface-container-high shadow-lg;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex items-center justify-center p-md lg:p-xl relative overflow-x-hidden font-body-md text-body-md text-on-surface">
<!-- Ambient Background Accents -->
<div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-fixed blur-[120px] opacity-60 pointer-events-none"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-secondary-fixed blur-[100px] opacity-40 pointer-events-none"></div>
<!-- Main Onboarding Container -->
<main class="glass-panel w-full max-w-[440px] rounded-xl flex flex-col relative z-10 overflow-hidden">
<!-- Progress Indicator -->
<div class="w-full h-1 bg-surface-container flex">
<div class="h-full bg-primary w-2/3 transition-all duration-500 rounded-r-full"></div>
</div>
<div class="p-lg lg:p-xl flex flex-col gap-xl">
<!-- Splash / Header Area -->
<div class="text-center flex flex-col items-center gap-sm">
<div class="w-16 h-16 rounded-2xl bg-primary-container text-on-primary-container flex items-center justify-center mb-sm shadow-sm">
<span class="material-symbols-outlined text-[32px]">school</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">That College Hub</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your campus, authenticated.</p>
</div>
<!-- Stacked Steps Representation -->
<div class="flex flex-col gap-md">
<!-- Step 1: College Selection (Completed State) -->
<div class="bg-surface-container-low rounded-lg p-md flex items-center justify-between border border-outline-variant/40 group cursor-pointer hover:bg-surface-container transition-colors">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-outline">
<span class="material-symbols-outlined text-[20px]">account_balance</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Campus</span>
<span class="font-label-lg text-label-lg text-on-surface">IIT Delhi</span>
</div>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">edit</span>
</div>
<!-- Step 2: Verification (Completed State) -->
<div class="bg-surface-container-low rounded-lg p-md flex items-center justify-between border border-outline-variant/40 group cursor-pointer hover:bg-surface-container transition-colors">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-tertiary-container/20 flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined text-[20px]">verified</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Verified Edu Email</span>
<span class="font-label-lg text-label-lg text-on-surface">jdoe24@iitd.edu.in</span>
</div>
</div>
<span class="material-symbols-outlined text-tertiary">check_circle</span>
</div>
<!-- Step 3: Profile Setup (Active State) -->
<div class="bg-surface rounded-xl p-md lg:p-lg border-2 border-primary/20 shadow-sm relative overflow-hidden">
<!-- Active Indicator Line -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
<h2 class="font-headline-sm text-headline-md text-on-surface mb-lg">Complete your profile</h2>
<form class="flex flex-col gap-md">
<!-- Photo Upload -->
<div class="flex justify-center mb-sm">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full bg-surface-container-high border-2 border-dashed border-outline-variant flex items-center justify-center overflow-hidden transition-all group-hover:border-primary group-hover:bg-primary-fixed-dim/20">
<span class="material-symbols-outlined text-[32px] text-outline group-hover:text-primary">add_a_photo</span>
</div>
<div class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-md border-2 border-surface-container-lowest">
<span class="material-symbols-outlined text-[16px]">add</span>
</div>
</div>
</div>
<!-- Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs" for="display_name">Display Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant" id="display_name" placeholder="How should we call you?" type="text"/>
</div>
<!-- Bio Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs" for="bio">Bio (Optional)</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant resize-none" id="bio" placeholder="Major, interests, or looking for roommates..." rows="3"></textarea>
</div>
</form>
</div>
</div>
<!-- Action Button -->
<div class="pt-sm mt-auto">
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-4 rounded-xl flex items-center justify-center gap-sm hover:bg-primary/90 active:scale-[0.98] transition-all shadow-md">
                    Enter the Hub
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</main>
</body></html>
