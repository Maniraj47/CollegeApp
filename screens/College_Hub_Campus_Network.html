<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex">
<!-- Left Branding Panel (Desktop Only) -->
<div class="hidden lg:flex flex-1 relative bg-primary items-end p-xl overflow-hidden">
<!-- Background Image with Blend -->
<img alt="campus background" class="absolute inset-0 w-full h-full object-cover mix-blend-overlay opacity-30" data-alt="vibrant energetic college campus scene with students walking between modern brick academic buildings during a sunny afternoon, warm golden sunlight, soft focus background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAOuilpIsngpAK8ObY-zzaxBYXdthDazCc05644QSPZnOudO4CNRZPUMt6i2nyvUmNf_Oq-VsOBBn01GCS2_t1-Lr0n7D3Q7OnUl4P5w3cv8Yo3dW0fDZQfuIFKR5UBbKLVxCUpb-azu2ICp2h5MqE9PXjidv0stCoGny_99B-4qe5ooCfXRd5CiVZJlM_FrnXSaKk0BNbq2Cg962J9LSw2tA2vNnteaKb_gvmW5pp2yYWL5xotm3Nw5L5GO-MzOZE6Zjt2837a6sY"/>
<!-- Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-primary via-primary/80 to-transparent"></div>
<!-- Ambient Color Blob -->
<div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-secondary-container/40 rounded-full blur-[120px]"></div>
<!-- Content -->
<div class="relative z-10 max-w-lg pb-xl">
<div class="w-16 h-16 bg-surface-container-lowest text-primary rounded-xl flex items-center justify-center mb-lg shadow-lg">
<span class="material-symbols-outlined" style="font-size: 36px; font-variation-settings: 'FILL' 1;">hub</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-primary mb-md">Welcome to<br/>Your Campus.</h1>
<p class="font-body-lg text-body-lg text-primary-fixed">Connect with peers, trade safely on the market, and stay updated with live campus alerts.</p>
</div>
</div>
<!-- Right Login Panel -->
<div class="w-full lg:w-[600px] xl:w-[700px] bg-surface flex flex-col justify-center px-lg py-xl md:px-xl lg:px-[80px] relative">
<!-- Mobile Logo -->
<div class="flex lg:hidden items-center gap-sm mb-xl">
<div class="w-12 h-12 bg-primary text-on-primary rounded-xl flex items-center justify-center shadow-md shadow-primary/20">
<span class="material-symbols-outlined" style="font-size: 28px; font-variation-settings: 'FILL' 1;">hub</span>
</div>
<span class="font-headline-md text-headline-md text-primary">College Hub</span>
</div>
<div class="max-w-[420px] w-full mx-auto">
<!-- Header -->
<div class="mb-xl">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your details to access your account.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-lg">
<!-- Email Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline">mail</span>
<input class="w-full h-12 pl-[48px] pr-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline/70 shadow-sm shadow-primary/5" id="email" placeholder="student@university.edu" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<label class="font-label-lg text-label-lg text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline">lock</span>
<input class="w-full h-12 pl-[48px] pr-[48px] bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline/70 shadow-sm shadow-primary/5" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[52px] mt-md bg-primary hover:bg-primary-container active:scale-[0.98] transition-all text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center shadow-[0_4px_14px_rgba(0,62,199,0.25)]" type="submit">
                    Login
                </button>
</form>
<!-- Footer / Sign Up -->
<div class="mt-xl pt-lg border-t border-outline-variant/30 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    New to campus? 
                    <a class="font-label-lg text-label-lg text-secondary hover:text-secondary-container ml-xs transition-colors" href="#">Sign up</a>
</p>
</div>
</div>
</div>
